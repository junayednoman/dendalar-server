services:
  postgres:
    image: postgres:16
    container_name: dendalar-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dendalar
    ports:
      - "5432:5432"
    networks:
      - dendalar-network
    volumes:
      - dendalar-postgres-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  dendalar-network:
    name: dendalar-network
    driver: bridge

volumes:
  dendalar-postgres-volume:
